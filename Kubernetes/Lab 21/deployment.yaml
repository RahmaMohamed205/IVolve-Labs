apiVersion: apps/v1
kind: Deployment
metadata:
  name: demoapp-deployment
  namespace: ivolve
spec:
  replicas: 2
  selector:
    matchLabels:
      app: demoapp
  template:
    metadata:
      labels:
        app: demoapp
    spec:
      containers:
      - name: demoapp
        image: your-dockerhub-username/demoapp:1
        ports:
        - containerPort: 80